name: task2_workflow
on:
  push:
    branches:
      - main
jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Image
        run: docker build . -t ghcr.io/ignatiossar/echo-api:latest
      - name: Push Image
        run: docker push ghcr.io/ignatiossar/echo-api:latest
